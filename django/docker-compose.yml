version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: yyb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: t_simple
      MYSQL_USER: yyb_user
      MYSQL_PASSWORD: your_db_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yyb-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yyb-django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # 将配置文件挂载到容器内（请根据实际情况修改）
      - ./simpleserver/config.yml:/app/simpleserver/config.yml:ro
      # 持久化日志
      - ./log:/app/log
      # 持久化上传的媒体文件
      - ./media:/app/media
      # 持久化搜索索引
      - ./whoosh_index:/app/whoosh_index
    environment:
      - DJANGO_SETTINGS_MODULE=simpleserver.settings
    # 如需在启动前执行数据库迁移，可取消下行注释并创建 entrypoint.sh
    # entrypoint: ["./entrypoint.sh"]

volumes:
  mysql_data:
  redis_data:
